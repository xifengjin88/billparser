[project]
name = "billparse"
version = "0.1.0"
description = "Parse any cloud bill (AWS, Azure, GCP, resellers) into canonical rows, validate, and analyze"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2", "numpy>=1.26", "openpyxl>=3.1", "pdfplumber>=0.11", "pyarrow>=15",
    "rapidfuzz>=3.9", "msgpack>=1.0", "requests>=2.31",
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
    "scikit-learn>=1.4", "joblib>=1.3",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
billparse = "billparse.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
