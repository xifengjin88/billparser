[project]
name = "billparse"
version = "0.1.0"
description = "Parse any cloud bill (AWS, Azure, GCP, resellers) into canonical rows, validate, and analyze"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pyarrow>=15",
    "rapidfuzz>=3.9",
    "msgpack>=1.0",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "authlib>=1.6",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "anthropic>=2.2.0",
    "pypdfium2>=4.30",          # page images in the source viewer
    "pillow>=12.3.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0", "ruff>=0.17.1"]

[project.scripts]
billparse = "billparse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["billparse", "svcres"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "backups", "data", "store", "migrations/versions"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["billparse", "svcres"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
