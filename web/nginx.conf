# the scheme the browser used: a tunnel (Cloudflare, ngrok) sends https in X-Forwarded-Proto
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2100m;           # the API accepts files up to MAX_UPLOAD_MB (2048 by default)
    gzip on;
    gzip_types application/json application/javascript text/css;

    location /api/ {
        proxy_pass http://api:8000/;      # /api/x -> http://api:8000/x
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;            # the sign-in's redirect address is built from these
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 900s;          # a parse with LLM routes takes minutes
        proxy_request_buffering off;
    }

    # built files have a hash in their name: they never change, so the browser keeps them
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;       # client-side routes
        add_header Cache-Control "no-cache";   # index.html: the browser asks each time, so a rebuild shows at once
    }
}
